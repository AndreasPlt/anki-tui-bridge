[project]
name = "anki-tui-bridge"
version = "0.3.0"
description = "Anki add-on that exposes the scheduler's review queue over localhost HTTP"
readme = "README.md"
authors = [
    { name = "Andreas Pletschko", email = "andreas.pletschko@gmail.com" }
]
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
